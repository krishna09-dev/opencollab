name: OpenCollab CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_ENV: test
  JWT_SECRET: ci_test_secret_that_is_long_enough_for_tests_123456789
  JWT_EXPIRES_IN: "604800"
  GITHUB_CLIENT_ID: ci_dummy_client_id
  GITHUB_CLIENT_SECRET: ci_dummy_client_secret
  GITHUB_CALLBACK_URL: http://localhost:5001/auth/github/callback
  FRONTEND_URL: http://localhost:5173

jobs:
  api:
    name: API Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build API
        run: pnpm -C apps/api build

      - name: Run API tests
        run: pnpm -C apps/api test:run

  web:
    name: Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
 
      - name: Build Web
        run: pnpm -C apps/web build